name: Android CI

# Run on pushes to main, on every pull request, and on demand from the Actions
# tab. Restricting pushes to main avoids a duplicate run for every commit on a
# PR branch (push + pull_request).
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests (JVM + Robolectric). No emulator required.
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          # compileSdk is 36.1 (see app/build.gradle.kts), AGP 9.1.1 defaults to
          # build-tools 36.0.0.
          packages: "platform-tools platforms;android-36.1 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      # app/build.gradle.kts points the debug signing config at
      # <rootDir>/debug.keystore, which is intentionally not checked in.
      - name: Generate debug signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Build APKs once after tests pass; downstream jobs reuse the artifacts.
  # ---------------------------------------------------------------------------
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools platforms;android-36.1 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Generate signing keystores
        env:
          # Optional repository secrets. When all three are present the real
          # release key is used; otherwise a throwaway CI key is generated so
          # the release APK still builds. The key alias MUST be "upload"
          # because that is hard-coded in app/build.gradle.kts.
          SECRET_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Debug keystore expected at <rootDir>/debug.keystore.
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          if [ -n "${SECRET_KEYSTORE_BASE64:-}" ] \
            && [ -n "${SECRET_STORE_PASSWORD:-}" ] \
            && [ -n "${SECRET_KEY_PASSWORD:-}" ]; then
            echo "Using release keystore from repository secrets."
            echo "$SECRET_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/ci-release.keystore"
            store_password="$SECRET_STORE_PASSWORD"
            key_password="$SECRET_KEY_PASSWORD"
          else
            echo "No release keystore secrets configured; generating an ephemeral CI keystore."
            store_password="ci-store-password"
            key_password="ci-key-password"
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/ci-release.keystore" \
              -storetype JKS \
              -storepass "$store_password" \
              -keypass "$key_password" \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Pianobar CI,OU=CI,O=CI,L=CI,ST=CI,C=US"
          fi

          {
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/ci-release.keystore"
            echo "STORE_PASSWORD=$store_password"
            echo "KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

      - name: Assemble debug and release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android Lint: easy hygiene check for manifest/permission/code issues.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools platforms;android-36.1 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Generate debug signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run lint
        run: |
          chmod +x ./gradlew
          ./gradlew :app:lintRelease --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-release.*
            app/build/reports/lint-results-release/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Trust/privacy audits on the built release APK artifact.
  # ---------------------------------------------------------------------------
  trust-audit:
    name: Trust audit
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools build-tools;36.0.0"

      - name: Download built APKs
        uses: actions/download-artifact@v8.0.2
        with:
          name: apks
          path: app/build/outputs/apk

      - name: APK permission/component audit
        run: |
          chmod +x scripts/audit-apk.sh
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          scripts/audit-apk.sh "$APK"

      - name: Exodus tracker scan (Docker)
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APK_DIR=$(dirname "$APK")
          APK_NAME=$(basename "$APK")
          docker run --rm -v "$PWD/$APK_DIR:/app" exodusprivacy/exodus-standalone -j -o "/app/exodus-report.json" "/app/$APK_NAME"
          python3 -c "import json,sys; d=json.load(open('$APK_DIR/exodus-report.json')); trackers=d.get('trackers',[]); print(f'Trackers detected: {len(trackers)}'); [print(' - '+(t.get('name',str(t)) if isinstance(t,dict) else str(t))) for t in trackers]; sys.exit(1 if trackers else 0)"
          cp "$APK_DIR/exodus-report.json" exodus-report.json

      - name: Upload trust audit artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trust-audit
          path: |
            exodus-report.json
          if-no-files-found: warn
